<style>
  :root{
    --ink:#16302B;
    --ink-soft:#3E5850;
    --paper:#F6F1E7;
    --paper-line:#D8CFBA;
    --paper-dim:#EFE8D8;
    --gold:#B98900;
    --gold-soft:#F1E4BE;
    --rust:#A63D2F;
    --rust-soft:#F3DFDA;
    --white:#FFFDF8;
    --green:#1E6B4E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    background:var(--ink);
    color:var(--white);
    padding:calc(22px + env(safe-area-inset-top)) 22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .topbar .brand{
    font-family:'Fraunces',serif;
    font-size:21px;
    font-weight:500;
    letter-spacing:0.2px;
  }
  .topbar .sub{
    font-size:12.5px;
    color:#AFC4BE;
    margin-top:2px;
  }
  .install-btn{
    border:1px solid #3A5850;
    background:transparent;
    color:var(--white);
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    display:none;
    white-space:nowrap;
  }
  .install-btn.show{display:inline-block;}

  .ios-hint{
    display:none;
    margin:14px 18px 0;
    background:var(--gold-soft);
    border:1px solid #E3CE8C;
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    color:#5C4700;
    line-height:1.4;
  }
  .ios-hint.show{display:block;}
  .ios-hint button{
    border:none;background:none;color:#5C4700;font-weight:700;
    float:right;cursor:pointer;font-size:13px;padding:0 0 0 8px;
  }

  main{
    flex:1;
    padding:18px 18px 100px;
    overflow-y:auto;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- shared ---- */
  .scope-toggle{
    display:flex;
    border:1px solid var(--paper-line);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .scope-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .scope-toggle button.active{
    background:var(--ink);
    color:var(--white);
  }
  #scope-month-input{
    display:none;
    width:100%;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:9px;
    background:var(--white);
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    margin-bottom:18px;
    outline:none;
  }
  #scope-month-input:focus{border-color:var(--ink);}

  .hero{
    text-align:left;
    padding:6px 2px 20px;
    border-bottom:1px solid var(--paper-line);
    margin-bottom:16px;
  }
  .hero .label{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .hero .amount{
    font-family:'Fraunces',serif;
    font-size:40px;
    font-weight:500;
    line-height:1.05;
    letter-spacing:-0.5px;
  }
  .hero .amount.positive{color:var(--green);}
  .hero .amount.negative{color:var(--rust);}
  .hero-breakdown{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .hero-breakdown b{font-weight:600;}

  .chip-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .chip{
    flex:1;
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:11px 12px;
  }
  .chip .chip-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .chip .chip-value{font-family:'Fraunces',serif;font-size:18px;font-weight:500;}
  .chip.income .chip-value{color:var(--green);}
  .chip.expense .chip-value{color:var(--rust);}

  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 10px;
  }
  .section-sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-6px 0 10px;
  }
  .section{margin-bottom:26px;}

  .method-bar{
    display:flex;
    height:10px;
    border-radius:6px;
    overflow:hidden;
    background:var(--paper-dim);
    margin-bottom:8px;
  }
  .method-bar .card-part{background:var(--ink);}
  .method-bar .cash-part{background:var(--gold);}
  .method-legend{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
  }
  .method-legend span b{color:var(--ink);}
  .method-block{margin-bottom:18px;}
  .method-block:last-child{margin-bottom:0;}

  .cat-row{margin-bottom:11px;}
  .cat-row .cat-top{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    margin-bottom:4px;
  }
  .cat-row .cat-name{color:var(--ink);display:flex;align-items:center;gap:6px;}
  .cat-row .cat-name .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-row .cat-amt{font-family:'Fraunces',serif;font-weight:500;color:var(--ink);}
  .cat-track{height:5px;background:var(--paper-dim);border-radius:4px;overflow:hidden;}
  .cat-fill{height:100%;border-radius:4px;}

  .donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .donut-wrap svg{flex-shrink:0;}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-row .lbl{flex:1;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
